name: Copy Lernwörter template

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Start
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout current Lernwörter source
        uses: actions/checkout@v5
        with:
          repository: abi15punkte/Lernw-rter
          ref: main
          path: source

      - name: Replace Start with Lernwörter state
        run: |
          rsync -a --delete --exclude '.git' source/ ./

      - name: Commit exact template state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create Start from current Lernwörter state"
            git push origin HEAD:main
            git push origin HEAD:development
          fi
